      name:
        example: Alma'ruf Hidayat
        type: string
      password:
        example: Admin@1234
        minLength: 8
        type: string
    required:
    - email
    type: object
  dto.ResponseError:
    properties:
      data: {}
      message:
        example: failed
        type: string
      success:
        example: false
        type: boolean
    type: object
  dto.ResponseSuccess:
    properties:
      data: {}
      message:
        example: success
        type: string
      success:
        example: true
        type: boolean
    type: object
host: 192.168.0.186:5000
info:
  contact: {}
