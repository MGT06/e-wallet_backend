          schema:
            $ref: '#/definitions/dto.ResponseError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      summary: Validation email for reset password
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Log in for get full access
      parameters:
