basePath: /
definitions:
  dto.AddFavoriteRequest:
    properties:
      favorite_account_id:
        type: integer
    type: object
  dto.ChangePinRequest:
    properties:
      new_pin:
        example: "654321"
        type: string
      old_pin:
        example: "123456"
        type: string
    required:
    - new_pin
    - old_pin
    type: object
  dto.CheckOTPRequest:
    properties:
      email:
        type: string
      otp:
        maxLength: 6
        minLength: 6
        type: string
    required:
    - email
    - otp
    type: object
  dto.CheckPinRequest:
    properties:
      pin:
        example: "123456"
        type: string
    required:
    - pin
    type: object
  dto.ForgotRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.LoginRequest:
    properties:
      email:
        example: almarufhidayat99@gmail.com
        type: string
      password:
        example: Admin@1234
        minLength: 8
        type: string
    required:
    - email
    type: object
  dto.RegisterRequest:
    properties:
      email:
        example: almarufhidayat99@gmail.com
        type: string
      name:
        example: Alma'ruf Hidayat
        type: string
      password:
        example: Admin@1234
        minLength: 7
        type: string
    required:
    - email
    type: object
  dto.ResetPassRequest:
    properties:
      new_password:
        minLength: 8
        type: string
      reset_token:
        type: string
    required:
    - new_password
    - reset_token
    type: object
  dto.ResponseError:
    properties:
      data: {}
      message:
        example: failed
        type: string
      success:
        example: false
        type: boolean
    type: object
  dto.ResponseSuccess:
    properties:
      data: {}
      message:
        example: success
        type: string
      success:
        example: true
        type: boolean
    type: object
  dto.SetPinRequest:
    properties:
      pin:
        example: "123456"
        type: string
    required:
    - pin
    type: object
  dto.TopupsRequest:
    properties:
      amount:
        type: integer
      payment_method_id:
        type: integer
      tax:
        type: integer
      total_amount:
        type: integer
      xendit_code:
        type: string
    type: object
  dto.UserChangePasswordRequest:
    properties:
      new_password:
        example: Admin@1234
        minLength: 8
        type: string
      old_password:
        example: Admin@1234
        minLength: 8
        type: string
    type: object
  dto.UserChangeProfileResponse:
    properties:
      email:
        type: string
      image_url:
        type: string
      name:
        type: string
      phone:
        type: string
    type: object
host: localhost:5000
info:
  contact: {}
  description: This is a sample send request use API.
  title: Application E-Walet
  version: "1.0"
paths:
  /auth/check-otp:
    post:
      consumes:
      - application/json
      parameters:
      - description: email and otp user
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CheckOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseSuccess'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseSuccess'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseSuccess'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      summary: Check OTP user
      tags:
      - Auth
  /auth/forgot:
