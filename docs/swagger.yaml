            $ref: '#/definitions/dto.ResponseError'
      security:
      - Bearer: []
      summary: User profile
      tags:
      - User
    patch:
      consumes:
      - multipart/form-data
      description: Update user profile details including name, phone, email, and profile
        picture
      parameters:
      - description: Full Name
        example: '"Alma''ruf Hidayat"'
        in: formData
        name: name
        type: string
      - description: Phone Number
        example: '"081973779380"'
        in: formData
        name: phone
        type: string
      - description: Email Address
        example: '"almarufhidayat99@gmail.com"'
        in: formData
        name: email
        type: string
      - description: Profile Picture (.jpg, .jpeg, .png, max 2MB)
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.ResponseSuccess'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserChangeProfileResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - Bearer: []
      summary: Change user profile
      tags:
      - User
  /user/set-pin:
