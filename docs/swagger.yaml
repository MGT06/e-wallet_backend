      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseSuccess'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - Bearer: []
      summary: Log out
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create new account for full access
      parameters:
      - description: Body data new user
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseSuccess'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      summary: Create New Account
      tags:
      - Auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: token and new password user
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPassRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/dto.ResponseSuccess'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseSuccess'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      summary: Reset Password User
      tags:
      - Auth
  /transaction/people:
    get:
      consumes:
      - application/json
      description: Get all users active
      parameters:
      - description: search people
        in: query
        name: search
        type: string
      - description: limit get data
        in: query
        name: limit
        type: integer
      produces:
